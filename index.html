<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HILLULA | המאיר לארץ</title>
  <meta name="description" content="עמוד עדכונים לקראת הילולת המאיר לארץ." />
  <style>
    :root { --ink:#352a1c; --gold:#ae892d; --paper:#f8f4ea; --wine:#5c2633; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; color:var(--ink); background:radial-gradient(circle at top,#fffdfa 0%,var(--paper) 56%,#eee6d3 100%); font-family:Arial,"Noto Sans Hebrew",sans-serif; }
    main { min-height:100vh; display:grid; grid-template-rows:1fr auto; padding:28px; }
    .hero { width:min(100%,710px); align-self:center; justify-self:center; position:relative; text-align:center; padding:clamp(54px,10vw,88px) clamp(26px,9vw,94px); border:1px solid rgba(174,137,45,.55); background:rgba(255,253,248,.68); box-shadow:0 20px 55px rgba(67,47,13,.12); }
    .hero::before { content:""; position:absolute; inset:10px; border:1px solid rgba(174,137,45,.25); pointer-events:none; }
    .star { position:absolute; color:var(--gold); font-size:21px; }.top { top:23px; right:24px; }.bottom { bottom:23px; left:24px; }
    .eyebrow { margin:0 0 12px; color:var(--wine); font-size:.88rem; letter-spacing:.11em; }.line { width:48px; height:1px; margin:0 auto 21px; background:var(--gold); }
    h1 { margin:0; color:var(--wine); font-family:Georgia,"Times New Roman",serif; font-size:clamp(2.5rem,7vw,4.8rem); font-weight:500; letter-spacing:.04em; }
    .subtitle { margin:16px 0 24px; color:var(--gold); font-size:clamp(1.05rem,2.5vw,1.35rem); font-weight:600; }.body { max-width:470px; margin:0 auto; font-size:1.05rem; line-height:1.9; }
    .status { display:inline-flex; align-items:center; gap:8px; margin-top:30px; padding:9px 14px; border-radius:100px; background:#f3ebda; color:#725a28; font-size:.9rem; }.dot { width:7px; height:7px; border-radius:50%; background:var(--gold); }
    footer { justify-self:center; padding-top:20px; color:#806f50; font-size:.82rem; letter-spacing:.08em; }
    @media (max-width:480px) { main { padding:15px; } .hero { padding-inline:24px; } }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="title">
      <span class="star top" aria-hidden="true">✦</span><span class="star bottom" aria-hidden="true">✦</span>
      <p class="eyebrow">בסייעתא דשמיא</p><div class="line" aria-hidden="true"></div>
      <h1 id="title">HILLULA</h1><p class="subtitle">הילולת המאיר לארץ</p>
      <p class="body">פרטים ועדכונים יעלו כאן בקרוב. אנו נערכים לקראת ההילולה, והעמוד יתעדכן בהמשך עם זמני האירוע, דרכי הגעה ופרטים נוספים.</p>
      <div class="status"><span class="dot" aria-hidden="true"></span>העמוד בהכנה</div>
    </section>
    <footer>המאיר לארץ</footer>
  </main>
</body>
</html>
